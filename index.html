  2) ไปที่ Build → Realtime Database → Create Database
     เลือก location ที่ใกล้ (เช่น asia-southeast1) แล้วเริ่มในโหมด "locked" ก็ได้ เดี๋ยวเราตั้ง rules เอง
     ไปที่แท็บ Rules แล้ววางทับด้วย:

       {
         "rules": {
           "board_state": {
             ".read": true,
             ".write": true
           },
           "gcal_sync": {
             ".read": true,
             ".write": true
           }
         }
       }

     (gcal_sync เก็บว่าใครเคยส่งงานไหนเข้า Google Calendar แล้วบ้าง — แยก path
     จาก board_state เพื่อไม่ให้การบันทึกบอร์ดปกติไปทับข้อมูลนี้ทิ้ง ต้องมี
     rule นี้ด้วยไม่งั้นทั้งทีมจะซิงก์ปฏิทินแบบแชร์กันไม่ได้ — คนละเครื่องจะ
     ไม่รู้ว่าอีกคนส่งอะไรไปแล้วบ้าง เลยส่งซ้ำ/แจ้งเตือนซ้ำ)

  3) ไปที่ Project settings (รูปเฟือง) → General → เลื่อนลงมา "Your apps" → กด </> เพิ่มแอปแบบ Web
     ตั้งชื่ออะไรก็ได้ ไม่ต้องติ๊ก Firebase Hosting ก็ได้
     คัดลอกค่า firebaseConfig ทั้งก้อนที่ขึ้นมา มาแทนที่ FIREBASE_CONFIG ด้านล่างนี้ (ทุกฟิลด์)

  หมายเหตุความปลอดภัย: ค่า apiKey นี้ฝังอยู่ในไฟล์ HTML และมองเห็นได้จากทุกคนที่เปิดไฟล์ — ตามปกติของ Firebase
  ความปลอดภัยจริงๆ ควบคุมด้วย Rules ด้านบน ซึ่งตอนนี้เปิดให้ "ใครก็ตามที่มีไฟล์/ลิงก์นี้" อ่าน-แก้บอร์ดได้ทั้งหมด
  เหมาะกับทีมเล็กที่ไว้ใจกัน ถ้าต้องการจำกัดสิทธิ์มากกว่านี้ (เช่น ต้อง login ก่อน) บอกให้ Claude ช่วยเพิ่ม auth ได้ภายหลัง

<style>
:root{
  --bg:#EBEEF3;
  --surface:#FFFFFF;
  --surface-2:#F4F6F9;
  --surface-3:#E6EAF0;
  --border:#D3DAE3;
  --border-strong:#B9C3D0;
  --text:#182029;
  --text-2:#47535F;
  --muted:#78838F;
  --accent:#2F5D7C;
  --accent-soft:#DCE8F0;
  --grid:#E2E7ED;
  --weekend:#F0F2F6;
  --today:#C2603F;
  --shadow:0 1px 2px rgba(20,32,48,.06), 0 8px 24px rgba(20,32,48,.08);

  --s-done:#3B8467;
  --s-process:#2F6FA8;
  --s-notstarted:#8A94A1;
  --s-postponed:#AC7A28;
  --s-cancel:#A25656;
  --s-dday:#7A4FA3;
  --s-overdue:#C1591A;

  --dayW:24px;
  --leftW:794px;
  --headH:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C;
    --surface:#1A1F27;
    --surface-2:#212832;
    --surface-3:#2A323E;
    --border:#2F3945;
    --border-strong:#3D4956;
    --text:#E6EBF1;
    --text-2:#B6C1CD;
    --muted:#8592A0;
    --accent:#7FB0D2;
    --accent-soft:#23323F;
    --grid:#242C36;
    --weekend:#1E242C;
    --today:#E08663;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --s-done:#4FA684;
    --s-process:#4E93CE;
    --s-notstarted:#8592A0;
    --s-postponed:#CB9944;
    --s-cancel:#C57575;
    --s-dday:#9A70C2;
    --s-overdue:#E08A4B;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C;
  --surface:#1A1F27;
  --surface-2:#212832;
  --surface-3:#2A323E;
  --border:#2F3945;
  --border-strong:#3D4956;
  --text:#E6EBF1;
  --text-2:#B6C1CD;
  --muted:#8592A0;
  --accent:#7FB0D2;
  --accent-soft:#23323F;
  --grid:#242C36;
  --weekend:#1E242C;
  --today:#E08663;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --s-done:#4FA684;
  --s-process:#4E93CE;
  --s-notstarted:#8592A0;
  --s-postponed:#CB9944;
  --s-cancel:#C57575;
  --s-dday:#9A70C2;
  --s-overdue:#E08A4B;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans Thai","Anuphan",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Anuphan","IBM Plex Sans Thai",sans-serif;margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;min-height:100vh}

.topbar{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;height:54px;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mark{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  font-family:"Anuphan",sans-serif;font-weight:700;font-size:11px;letter-spacing:.02em;
}
.brand b{font-family:"Anuphan",sans-serif;font-weight:600;font-size:14px;letter-spacing:.01em}
.brand span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}

.tabs{display:flex;gap:2px;align-items:center;flex:1 1 auto;min-width:0;overflow-x:auto}
.tab{
  border:1px solid transparent;background:transparent;color:var(--text-2);
  padding:6px 13px;border-radius:8px;white-space:nowrap;font-weight:500;
  display:flex;align-items:baseline;gap:7px;
}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--border)}
.tab i{font-style:normal;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] i{color:var(--accent);opacity:.75}

.topright{display:flex;align-items:center;gap:8px;flex:0 0 auto}

.savechip{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--muted);
  padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  white-space:nowrap;
}
.savedot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.savechip[data-s="saved"] .savedot{background:var(--s-done)}
.savechip[data-s="saving"] .savedot{background:var(--s-postponed);animation:pulse 1s ease-in-out infinite}
.savechip[data-s="unsaved"] .savedot{background:var(--s-postponed)}
.savechip[data-s="error"] .savedot{background:var(--s-cancel)}
.savechip[data-s="connecting"] .savedot{background:var(--s-notstarted);animation:pulse 1s ease-in-out infinite}
.savechip[data-s="unconfigured"] .savedot{background:var(--s-cancel)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.savechip[data-s="saving"] .savedot{animation:none}}
.gdot{width:6px;height:6px;border-radius:50%;background:var(--s-done);display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  padding:5px 11px;border-radius:8px;font-weight:500;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--s-cancel);border-color:var(--border)}
.btn.danger:hover{background:var(--s-cancel);border-color:var(--s-cancel);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:7px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:var(--text-2)}
a.btn:hover{text-decoration:none;color:var(--text)}
a.btn.primary{color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- toolbar ---------- */
.goals{
  flex:0 0 auto;display:flex;align-items:center;gap:16px;
  padding:9px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);
}
.goalsrow{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-width:0}
.goalitem{min-width:0}
.goalhead{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:11px;color:var(--text-2);margin-bottom:4px;white-space:nowrap;overflow:hidden;
}
.goalhead span{overflow:hidden;text-overflow:ellipsis}
.goalhead b{
  font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.goaltrack{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.goalfill{height:100%;background:var(--accent);border-radius:999px}
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);
}
.boardtitle{display:flex;flex-direction:column;gap:1px;margin-right:2px}
.boardtitle h1{font-size:16px;font-weight:600;letter-spacing:-.005em}
.boardtitle p{margin:0;font-size:11.5px;color:var(--muted)}
.tsep{width:1px;height:26px;background:var(--border);flex:0 0 auto}
.tgroup{display:flex;align-items:center;gap:6px}
.tlabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}

.pic-filter{display:flex;gap:4px;flex-wrap:wrap}
.picpill{
  border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:2px 10px 3px;font-size:11.5px;font-weight:500;
  display:flex;align-items:center;gap:5px;color:var(--text-2);
}
.picpill .dot{width:7px;height:7px;border-radius:50%;background:var(--m,#888)}
.picpill[aria-pressed="true"]{background:var(--surface-3);border-color:var(--border-strong);color:var(--text)}
.picpill:hover{border-color:var(--border-strong)}
.picpill.allpill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;padding:3px 10px}

select.ctl,input.ctl{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:5px 9px;color:var(--text);
}
select.ctl:hover,input.ctl:hover{border-color:var(--border-strong)}

.stats{display:flex;gap:0;margin-left:auto;align-items:stretch}
.stat{padding:0 14px;border-left:1px solid var(--border);display:flex;flex-direction:column;justify-content:center}
.stat:first-child{border-left:0}
.stat b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;font-family:"IBM Plex Mono",monospace}
.stat span{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat.done b{color:var(--s-done)} .stat.proc b{color:var(--s-process)} .stat.late b{color:var(--s-overdue)}

/* ---------- gantt ---------- */
.viewport{flex:1 1 auto;overflow:auto;position:relative;background:var(--surface)}
.canvas{position:relative;min-width:100%}

.head{
  position:sticky;top:0;z-index:5;height:var(--headH);display:flex;
  background:var(--surface);border-bottom:1px solid var(--border-strong);
}
.head .left{
  position:sticky;left:0;z-index:6;width:var(--leftW);flex:0 0 auto;
  background:var(--surface);border-right:1px solid var(--border-strong);
  display:grid;grid-template-columns:var(--cols);align-items:end;
}
.head .left>div{
  padding:0 8px 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600;line-height:1.25;
}
.head .track{flex:0 0 auto;position:relative}
.mrow{display:flex;height:28px;align-items:center}
.mcell{
  height:100%;display:flex;align-items:center;flex:0 0 auto;
  border-left:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-2);
  white-space:nowrap;letter-spacing:.01em;
}
.mcell span{
  position:sticky;left:calc(var(--leftW) + 9px);padding-right:10px;
  background:var(--surface);
}
.drow{display:flex;height:29px}
.dcell{
  flex:0 0 auto;width:var(--dayW);display:grid;place-items:center;
  font-size:9.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;border-left:1px solid var(--grid);
}
.dcell.we{background:var(--weekend)}
.dcell.mstart{border-left:1px solid var(--border-strong)}
.dcell.today{background:var(--today);color:#fff;font-weight:500}

.overlay{position:absolute;top:var(--headH);bottom:0;z-index:1;pointer-events:none}
.mline{position:absolute;top:0;bottom:0;width:1px;background:var(--border-strong);opacity:.55}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.5}

.rows{position:relative;z-index:2}

.sect{display:flex;position:relative;z-index:3}
.sect .left{
  position:sticky;left:0;width:var(--leftW);flex:0 0 auto;
  background:var(--surface-3);border-right:1px solid var(--border-strong);
  display:flex;align-items:center;gap:8px;padding:7px 10px;
}
.sect .track{flex:0 0 auto;background:var(--surface-3)}
.sect h2{
  font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--text);
  margin:0;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.collapsebtn{
  border:0;background:none;color:var(--muted);width:18px;height:18px;flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;border-radius:5px;line-height:1;
}
.collapsebtn:hover{background:var(--surface);color:var(--text)}
.sect .count{
  font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 7px;
}
.sectdday{
  font-size:10.5px;color:var(--s-dday);font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap;
}
.sect .grow{flex:1 1 auto}
.sectacts{display:flex;gap:4px;opacity:0;transition:opacity .12s;flex:0 0 auto}
.sect:hover .sectacts,.sect:focus-within .sectacts{opacity:1}

.row{display:flex;position:relative}
.row:hover .left{background:var(--surface-2)}
.row .left{
  position:sticky;left:0;z-index:3;width:var(--leftW);flex:0 0 auto;
  background:var(--surface);border-right:1px solid var(--border-strong);
  border-bottom:1px solid var(--grid);
  display:grid;grid-template-columns:var(--cols);align-items:center;min-height:34px;
}
.row .left>div{padding:5px 8px;min-width:0;overflow:hidden}
.row .track{flex:0 0 auto;position:relative;border-bottom:1px solid var(--grid)}

.c-act{font-weight:500;white-space:nowrap;text-overflow:ellipsis}
.c-rem{color:var(--muted);font-size:11.5px;white-space:nowrap;text-overflow:ellipsis}
.c-num{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--text-2);white-space:nowrap;
}
.c-dur{text-align:center}
.c-act button{
  background:none;border:0;padding:0;text-align:left;width:100%;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);
}
.c-act button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.c-act{display:flex;align-items:center;gap:5px;min-width:0}
.c-act button{flex:0 1 auto;min-width:0}
.linkic{
  flex:0 0 auto;color:var(--accent);text-decoration:none;font-size:11px;
  display:inline-flex;align-items:center;opacity:.85;
}
.linkic:hover{opacity:1;text-decoration:underline}
.propbadge{
  flex:0 0 auto;font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--s-dday);
  background:color-mix(in srgb, var(--s-dday) 14%, transparent);
  border-radius:5px;padding:1px 5px;white-space:nowrap;
}

.pics{display:flex;gap:3px;flex-wrap:nowrap}
.pic{
  width:20px;height:20px;border-radius:6px;flex:0 0 auto;
  display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;
  background:var(--m,#888);letter-spacing:.01em;
}
.pic.all{width:auto;padding:0 7px;background:var(--text-2)}

select.statussel{
  border:1px solid transparent;background:var(--st-bg,var(--surface-2));color:var(--st-fg,var(--text-2));
  border-radius:999px;padding:2px 6px 3px 8px;font-size:11px;font-weight:500;
  max-width:100%;appearance:none;text-align:left;
}
select.statussel:hover{border-color:var(--border-strong)}
select.statussel option{background:var(--surface);color:var(--text)}

.rowact{display:flex;justify-content:center;gap:1px}
.iconbtn{
  border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;font-size:14px;line-height:1;opacity:0;transition:opacity .12s;
}
.row:hover .iconbtn,.row:focus-within .iconbtn{opacity:1}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}

.bar{
  position:absolute;top:7px;height:20px;border-radius:5px;
  background:var(--c);display:flex;align-items:center;padding:0 7px;
  font-size:10.5px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,32,48,.18);
}
.bar.ghost{background:transparent;border:1px dashed var(--c);color:var(--c);box-shadow:none}
.bar.dday{border-radius:4px;background:var(--c);min-width:12px}
.bar .pct{position:absolute;inset:0;background:rgba(255,255,255,.18)}

.addrow{display:flex;position:relative}
.addrow .left{
  position:sticky;left:0;z-index:3;width:var(--leftW);flex:0 0 auto;
  background:var(--surface);border-right:1px solid var(--border-strong);
  border-bottom:1px solid var(--grid);padding:4px 10px;
}
.addrow .track{flex:0 0 auto;border-bottom:1px solid var(--grid)}
.linkbtn{
  border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:500;
  padding:2px 6px;border-radius:6px;
}
.linkbtn:hover{color:var(--accent);background:var(--accent-soft)}

.emptyboard{padding:56px 24px;text-align:center;color:var(--muted);position:sticky;left:0;max-width:520px;margin:0 auto}
.emptyboard h3{font-size:15px;color:var(--text);margin-bottom:6px}
.emptyboard p{margin:0 0 16px;font-size:12.5px}

/* ---------- customer board ---------- */
.custwrap{padding:20px 24px 40px;max-width:1100px;margin:0 auto}
.custaddbar{display:flex;justify-content:flex-end;margin-bottom:14px}
.custgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.custcard{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;
}
.custhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.custhead h3{font-size:14.5px;font-weight:600}
.custorg{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.custacts{display:flex;gap:4px;flex:0 0 auto}
.custrow{font-size:12.5px;color:var(--text-2);display:flex;gap:6px}
.custlabel{color:var(--muted);flex:0 0 auto}
.custstats{display:flex;gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.custstat{flex:1 1 0;padding:8px 0;text-align:center}
.custstat:first-child{border-right:1px solid var(--border)}
.custstat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.custstat span{font-size:10px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.custjobs{display:flex;flex-wrap:wrap;gap:5px}
.custjobpill{
  font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text-2);
}
.custjobdate{color:var(--s-dday);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.colorswatches{display:flex;flex-wrap:wrap;gap:7px}
.colorsw{
  width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;
  display:grid;place-items:center;color:#fff;font-size:12px;
}
.colorsw[aria-pressed="true"]{border-color:var(--text)}

.footer{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 18px;background:var(--surface);border-top:1px solid var(--border);
  font-size:11px;color:var(--muted);
}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--c);display:block}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(16,22,30,.42);backdrop-filter:blur(2px);
  display:grid;place-items:center;z-index:50;padding:20px;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);width:min(560px,100%);max-height:88vh;overflow:auto;
}
.modal header{
  padding:16px 20px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.modal header h2{font-size:15px;font-weight:600}
.modal .body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{
  padding:12px 20px 16px;display:flex;gap:8px;align-items:center;
  border-top:1px solid var(--border);
}
.modal footer .spacer{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%;
}
.field textarea{resize:vertical;min-height:56px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr .6fr 1fr;gap:14px}
.picks{display:flex;gap:6px;flex-wrap:wrap}
.pickbtn{
  border:1px solid var(--border);background:var(--surface-2);border-radius:8px;
  padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text-2);font-weight:500;
}
.pickbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--m,#888)}
.pickbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.pickbtn.allpick{font-weight:600}
.picks .allpick{margin-right:4px}
.hint{font-size:11px;color:var(--muted)}
.field>label.chk{text-transform:none;letter-spacing:normal;font-weight:400}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);cursor:pointer;padding:2px 0}
.chk input{width:auto;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.chk span{flex:1 1 auto}
.propblock{
  display:flex;flex-direction:column;gap:14px;
  border-left:2px solid var(--s-dday);padding:2px 0 2px 14px;margin-left:1px;
}
.teamrow{display:grid;grid-template-columns:74px 1fr 44px;gap:8px;align-items:center}
.teamrow .email{grid-column:1 / -1;font-size:12px}
.teamrow+.teamrow{border-top:1px solid var(--border);padding-top:12px}

@media (max-width:900px){
  .stats{margin-left:0;width:100%;order:9;border-top:1px solid var(--border);padding-top:8px}
  .boardtitle{width:100%}
}
</style>

/* named tr() rather than t() — this codebase's convention uses `t` as the
   loop/param name for "current task" almost everywhere, so a global t()
   would get silently shadowed (and crash as "t is not a function") in any
   of those scopes. tr() avoids the collision entirely. */
function tr(key, vars){
  var s = (I18N[view.lang] && I18N[view.lang][key]) || I18N.th[key] || key;
  if(vars) Object.keys(vars).forEach(function(k){ s = s.split("{"+k+"}").join(vars[k]); });
  return s;
}

var MONS_BY_LANG = {
  th: ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],
  en: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};

/* ============ date helpers (UTC-safe) ============ */
function ymd(d){
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
}
function parse(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length!==3) return null;
  var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function addDays(d,n){ return new Date(d.getTime()+n*86400000); }
function diffDays(a,b){ return Math.round((b.getTime()-a.getTime())/86400000); }
function todayUTC(){
  var n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function dueOf(t){
  var s = parse(t.start);
  if(!s) return null;
  return addDays(s, Math.max(1,(t.dur||1))-1);
}
/* keeps status in sync with today's date: a Not-started task flips to In
   process once its start date arrives, and anything not yet Done flips to
   Overdue once its due date has passed. Cancel/D-DAY are left alone — a
   cancelled task was never going to be "late", and D-DAY marks the event
   day itself rather than a to-do that can be overdue. Runs before every
   render so a tab left open across midnight self-heals; returns true if it
   changed anything so the caller knows to persist the change. */
function applyAutoStatuses(){
  if(!state) return false;
  var tod = todayUTC();
  var changed = false;
  state.boards.forEach(function(b){
    b.sections.forEach(function(s){
      s.tasks.forEach(function(t){
        if(t.status==="Done" || t.status==="Cancel" || t.status==="D-DAY") return;
        var due = dueOf(t);
        if(due && due < tod){
          if(t.status !== "Overdue"){ t.status = "Overdue"; changed = true; }
          return;
        }
        var st = parse(t.start);
        if(st && st <= tod && t.status === "Not started"){
          t.status = "In process";
          changed = true;
        }
      });
    });
  });
  return changed;
}
function fmtShort(s){
  var d = parse(s);
  if(!d) return "—";
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+String(d.getUTCFullYear()).slice(2);
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }

/* ============ firebase ============ */
var FB_PATH = "board_state";
var fbDb = null;
function fbConfigured(){
  var c = window.FIREBASE_CONFIG;
  return !!(c && c.apiKey && c.apiKey.indexOf("YOUR_API_KEY") < 0 &&
            c.databaseURL && c.databaseURL.indexOf("YOUR_PROJECT") < 0);
}
function initFirebase(){
  if(!fbConfigured() || !window.firebase) return null;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    return firebase.database();
  }catch(e){ return null; }
}
/* Firebase Realtime Database drops empty arrays/objects entirely (a section
   with zero tasks comes back as undefined, not []) — patch that back in
   wherever state is loaded, so the rest of the app can assume arrays exist. */
function normalizeState(s){
  if(!s) return s;
  s.boards = s.boards || [];
  s.boards.forEach(function(b){
    b.sections = b.sections || [];
    b.sections.forEach(function(sec){
      sec.tasks = sec.tasks || [];
      sec.color = sec.color || "";
      sec.customerId = sec.customerId || "";
    });
  });
  s.team = s.team || [];
  s.customers = s.customers || [];
  /* named goals2027 historically — now tracks 2026, kept the key so live data isn't migrated */
  s.goals2027 = s.goals2027 || {salesTarget:0, participantsTarget:0, workshopsTarget:0};
  if(s.goals2027.salesBase == null) s.goals2027.salesBase = 1028970;
  if(s.goals2027.participantsBase == null) s.goals2027.participantsBase = 0;
  if(s.goals2027.workshopsBase == null) s.goals2027.workshopsBase = 0;
  return s;
}
/* Rebuilds localArr to match remoteArr's content/order, but for any item that
   already exists locally (matched by key), mutates that SAME object in place
   instead of swapping in the remote's plain object. This preserves object
   identity for anything already referenced elsewhere (e.g. a task/section a
   modal has open) so a realtime update landing mid-edit can't orphan it. */
function mergeByKey(localArr, remoteArr, key, excludeKey){
  key = key || "id";
  var localByKey = {};
  localArr.forEach(function(item){ localByKey[item[key]] = item; });
  var result = remoteArr.map(function(r){
    var existing = localByKey[r[key]];
    if(existing){
      Object.keys(existing).forEach(function(k){ if(k!==excludeKey && !(k in r)) delete existing[k]; });
      Object.keys(r).forEach(function(k){ if(k!==excludeKey) existing[k] = r[k]; });
      return existing;
    }
    return r;
  });
  localArr.length = 0;
  Array.prototype.push.apply(localArr, result);
}
/* merges a freshly-arrived remote snapshot into the existing `state` object
   IN PLACE (rather than `state = remote`), so open modals holding direct
   references to a board/section/task/customer object keep working correctly
   even if a save-echo or a teammate's edit arrives while they're mid-edit.
   excludeKey on the nested-collection merges keeps mergeByKey's own
   Object.assign from clobbering the child array reference (sections/tasks)
   before the per-level loop below gets a chance to merge it separately. */
function mergeState(remote){
  remote = normalizeState(remote);
  if(!state){ state = remote; return; }
  mergeByKey(state.boards, remote.boards, "id", "sections");
  state.boards.forEach(function(b, bi){
    var rb = remote.boards[bi];
    if(!rb) return;
    mergeByKey(b.sections, rb.sections, "id", "tasks");
    b.sections.forEach(function(s, si){
      var rs = rb.sections[si];
      if(!rs) return;
      mergeByKey(s.tasks, rs.tasks, "id");
    });
  });
  mergeByKey(state.team, remote.team, "code");
  mergeByKey(state.customers, remote.customers, "id");
  state.dayW = remote.dayW;
  state.goals2027 = remote.goals2027;
  state.activeBoard = remote.activeBoard;
  state.v = remote.v;
}
function subscribeRealtime(){
  if(!fbDb) return;
  fbDb.ref(FB_PATH).on("value", function(snap){
    var v = snap.val();
    if(v && Object.keys(v).length){
      mergeState(v);
      render();
    }
    setSave("saved");
  }, function(){
    setSave("error");
  });
}

/* ============ range ============ */
function rangeOf(b){
  var lo = null, hi = null;
  b.sections.forEach(function(s){
    s.tasks.forEach(function(t){
      var st = parse(t.start), du = dueOf(t);
      if(st && (!lo || st < lo)) lo = st;
      if(du && (!hi || du > hi)) hi = du;
    });
  });
  var tod = todayUTC();
  if(!lo) lo = tod;
  if(!hi) hi = addDays(tod, 60);
  if(tod < lo) lo = tod;
  if(tod > hi) hi = tod;
  var start = new Date(Date.UTC(lo.getUTCFullYear(), lo.getUTCMonth(), 1));
  var end = new Date(Date.UTC(hi.getUTCFullYear(), hi.getUTCMonth()+1, 0));
  if(diffDays(start,end) < 80) end = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth()+3, 0));
  return {start:start, end:end, days: diffDays(start,end)+1};
}

/* ============ filtering ============ */
/* a task done more than a month ago is clutter, not a decision anyone needs
   to see day to day — hidden by default, but never deleted; the "show old
   completed tasks" toggle brings them straight back. */
function isOldDone(t){
  if(t.status !== "Done") return false;
  var du = dueOf(t);
  return !!(du && diffDays(du, todayUTC()) > 30);
}
function visible(t){
  if(filters.status && t.status !== filters.status) return false;
  if(filters.pic.length){
    var hit = (t.pic||[]).some(function(p){ return filters.pic.indexOf(p) >= 0; });
    if(!hit) return false;
  }
  if(!view.showOldDone && isOldDone(t)) return false;
  return true;
}
/* a project whose tasks are all Done is finished business — hidden from the
   default view like an old-done task, but findable via the same kind of
   toggle rather than actually removed. */
function isProjectDone(s){
  return s.tasks.length > 0 && s.tasks.every(function(t){ return t.status === "Done"; });
}

/* ============ goal 2027 ============ */
/* sums only the amounts entered on D-DAY tasks due within the goal year —
   this is added on top of the fixed "base" amount in goalsPanel() below */
function goals2027Sums(){
  var sales=0, participants=0, workshops=0;
  state.boards.forEach(function(b){
    b.sections.forEach(function(s){
      s.tasks.forEach(function(t){
        if(t.status !== "D-DAY") return;
        var du = dueOf(t);
        if(!du || du.getUTCFullYear() !== 2026) return;
        var g = t.d2027 || {};
        sales += (+g.sales)||0;
        participants += (+g.participants)||0;
        workshops += (+g.workshops)||0;
      });
    });
  });
  return {sales:sales, participants:participants, workshops:workshops};
}

    '<div class="goaltrack"><div class="goalfill" style="width:'+pct+'%"></div></div>'+
  '</div>';
}

/* ============ customer board ============ */
function customerSections(customerId){
  var out = [];
  state.boards.forEach(function(b){
    b.sections.forEach(function(s){
      if(s.customerId === customerId) out.push({board:b, section:s});
    });
  });
  return out;
}
/* earliest start → latest due across that section's D-DAY task(s), for display
   next to the section name — empty string if the section has no D-DAY task */
function sectionDdayRange(s){
  var from = null, to = null;
  s.tasks.forEach(function(t){
    if(t.status !== "D-DAY") return;
    var st = parse(t.start), du = dueOf(t);
    if(st && (!from || st < from)) from = st;
    if(du && (!to || du > to)) to = du;
  });
  if(!from || !to) return "";
  return fmtShort(ymd(from)) + " – " + fmtShort(ymd(to));
}
/* cumulative revenue for a customer = sum of the "sales" figure entered on
   every task inside every section linked to them (not just D-DAY, and not
   restricted to 2027 — this is a running lifetime total, unlike the 2027
   goal panel which only counts D-DAY tasks due within that year). */
function customerRevenue(customerId){
  var total = 0;
  customerSections(customerId).forEach(function(j){
    j.section.tasks.forEach(function(t){
      total += (t.d2027 && (+t.d2027.sales)) || 0;
    });
  });
  return total;
}

function head(r, dayW, trackW){
  var months = [], cur = new Date(r.start.getTime());
  while(cur <= r.end){
    var mEnd = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 0));
    var to = mEnd > r.end ? r.end : mEnd;
    months.push({d:new Date(cur.getTime()), n:diffDays(cur,to)+1});
    cur = addDays(to,1);
  }
  var mrow = months.map(function(m){
    var w = m.n*dayW;
    var label = (w >= 92 ? MON()[m.d.getUTCMonth()] : MONS()[m.d.getUTCMonth()]) + " " + String(m.d.getUTCFullYear()).slice(2);
    return '<div class="mcell" style="width:'+w+'px"><span>'+esc(label)+'</span></div>';
  }).join("");

  var tod = ymd(todayUTC());
  var drow = "";
  for(var i=0;i<r.days;i++){
    var d = addDays(r.start,i);
    var wd = d.getUTCDay();
    var cls = "dcell";
    if(wd===0 || wd===6) cls += " we";
    if(d.getUTCDate()===1) cls += " mstart";
    if(ymd(d)===tod) cls += " today";
    drow += '<div class="'+cls+'">'+d.getUTCDate()+'</div>';
  }

  return '<div class="head">'+
    '<div class="left">'+
      (view.compact
        ? '<div>PIC</div><div>Activities&#39; Processes</div><div>Status</div><div></div>'
        : '<div>PIC</div><div>Activities&#39; Processes</div><div>Remark</div><div>Status</div>'+
          '<div>Start</div><div>Dur</div><div>Due</div><div></div>')+
    '</div>'+
    '<div class="track" style="width:'+trackW+'px">'+
      '<div class="mrow">'+mrow+'</div>'+
      '<div class="drow">'+drow+'</div>'+
    '</div>'+
  '</div>';
}

function overlay(r, dayW, trackW){
  var out = "", cur = new Date(Date.UTC(r.start.getUTCFullYear(), r.start.getUTCMonth()+1, 1));
  while(cur <= r.end){
    out += '<div class="mline" style="left:'+(diffDays(r.start,cur)*dayW)+'px"></div>';
    cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 1));
  }
  var tod = todayUTC();
  if(tod >= r.start && tod <= r.end){
    out += '<div class="todayline" style="left:'+(diffDays(r.start,tod)*dayW + dayW/2 - 1)+'px"></div>';
  }
  return '<div class="overlay" style="left:'+leftW()+'px;width:'+trackW+'px">'+out+'</div>';
}

function trackBg(r, dayW){
  var offset = -(r.start.getUTCDay()===0 ? 6 : r.start.getUTCDay()-1) * dayW;
  return 'background-image:repeating-linear-gradient(90deg,transparent 0 '+(5*dayW)+'px,var(--weekend) '+(5*dayW)+'px '+(7*dayW)+'px),'+
    'repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px '+dayW+'px);'+
    'background-position:'+offset+'px 0, 0 0;';
}

function taskRow(t, s, r, dayW, trackW, bg){
  var m = t.pic || [];
  var picHtml;
  if(m.length && m.length === state.team.length) picHtml = '<span class="pic all">ALL</span>';
  else picHtml = m.slice(0,3).map(function(c){
    var mm = member(c);
    return '<span class="pic" style="--m:'+esc(mm.color)+'" title="'+esc(mm.name)+'">'+esc(c.slice(0,2))+'</span>';
  }).join("") + (m.length>3 ? '<span class="pic" style="--m:var(--muted)">+'+(m.length-3)+'</span>' : "");
  if(!m.length) picHtml = '<span class="c-rem">—</span>';

  var svar = SVAR[t.status] || "--s-notstarted";
  var sel = STATUSES.map(function(x){
    return '<option value="'+esc(x)+'"'+(t.status===x?" selected":"")+'>'+esc(x)+'</option>';
  }).join("");

  var st = parse(t.start), du = dueOf(t);
  var bar = "";
  if(st && du){
    var from = st < r.start ? r.start : st;
    var to = du > r.end ? r.end : du;
    if(to >= r.start && from <= r.end){
      var left = diffDays(r.start, from) * dayW;
      var w = Math.max(dayW, (diffDays(from,to)+1) * dayW) - 2;
      var ghost = (t.status==="Cancel" || t.status==="Not started") ? " ghost" : "";
      var dd = t.status==="D-DAY" ? " dday" : "";
      var lbl = w > 58 ? esc(t.title) : "";
      bar = '<div class="bar'+ghost+dd+'" style="left:'+(left+1)+'px;width:'+w+'px;--c:var('+svar+')" title="'+esc(t.title)+'">'+lbl+'</div>';
    }
  }

  return '<div class="row" data-task="'+esc(t.id)+'" data-sect="'+esc(s.id)+'">'+
    '<div class="left">'+
      '<div class="pics">'+picHtml+'</div>'+
      '<div class="c-act"><button data-edit="'+esc(t.id)+'" title="'+esc(t.title)+'">'+esc(t.title)+'</button>'+
        (t.isProposal ? '<span class="propbadge" title="'+esc(tr("proposal_title"))+'">Proposal</span>' : '')+
        (t.link ? '<a class="linkic" href="'+esc(t.link)+'" target="_blank" rel="noopener noreferrer" title="'+esc(tr("open_link_title",{link:t.link}))+'">&#128279;</a>' : '')+
      '</div>'+
      (view.compact ? '' : '<div class="c-rem" title="'+esc(t.remark||"")+'">'+esc(t.remark||"")+'</div>')+
      '<div><select class="statussel" data-status="'+esc(t.id)+'" '+(readOnly?"disabled":"")+
        ' style="--st-bg:color-mix(in srgb, var('+svar+') 16%, transparent);--st-fg:var('+svar+')">'+sel+'</select></div>'+
      (view.compact ? '' :
        '<div class="c-num">'+fmtShort(t.start)+(t.startTime?' '+esc(t.startTime):'')+'</div>'+
        '<div class="c-num c-dur">'+(t.dur||1)+'</div>'+
        '<div class="c-num">'+(du?fmtShort(ymd(du)):"—")+(t.dueTime?' '+esc(t.dueTime):'')+'</div>')+
      '<div class="rowact">'+(readOnly?"":(function(){
        var ti = s.tasks.indexOf(t);
        return (ti>0?'<button class="iconbtn" data-task-up="'+esc(t.id)+'" data-sect="'+esc(s.id)+'" aria-label="'+esc(tr("move_up"))+'" title="'+esc(tr("move_up"))+'">&#8593;</button>':'')+
          (ti<s.tasks.length-1?'<button class="iconbtn" data-task-down="'+esc(t.id)+'" data-sect="'+esc(s.id)+'" aria-label="'+esc(tr("move_down"))+'" title="'+esc(tr("move_down"))+'">&#8595;</button>':'')+
          '<button class="iconbtn" data-edit="'+esc(t.id)+'" aria-label="'+esc(tr("edit_title_aria",{title:t.title}))+'">&#9998;</button>';
      })())+'</div>'+
    '</div>'+
    '<div class="track" style="width:'+trackW+'px;'+bg+'">'+bar+'</div>'+
  '</div>';
}

function jumpToday(smooth){
  var vp = document.getElementById("viewport");
  if(!vp) return;
  var r = rangeOf(board());
  var dayW = view.dayW || 24;
  var tod = todayUTC();
  if(tod < r.start || tod > r.end) return;
  var pad = Math.min(220, Math.max(60, (vp.clientWidth - leftW()) * 0.22));
  var x = diffDays(r.start, tod)*dayW - pad;
  vp.scrollTo({left:Math.max(0,x), behavior: smooth ? "smooth" : "auto"});
}

function moveSection(id, dir){
  var b = board();
  var i = -1;
  for(var k=0;k<b.sections.length;k++) if(b.sections[k].id===id){ i=k; break; }
  var j = i + dir;
  if(i<0 || j<0 || j>=b.sections.length) return;
  var tmp = b.sections[i]; b.sections[i] = b.sections[j]; b.sections[j] = tmp;
  touch(); render();
}
function moveTask(taskId, sectId, dir){
  var b = board(), s = null;
  for(var k=0;k<b.sections.length;k++) if(b.sections[k].id===sectId){ s=b.sections[k]; break; }
  if(!s) return;
  var i = s.tasks.indexOf(s.tasks.filter(function(t){return t.id===taskId;})[0]);
  var j = i + dir;
  if(i<0 || j<0 || j>=s.tasks.length) return;
  var tmp = s.tasks[i]; s.tasks[i] = s.tasks[j]; s.tasks[j] = tmp;
  touch(); render();
}
/* sorts a section's tasks by start or due date (ascending); tasks with no
   parseable date sink to the bottom. Order can still be nudged afterward
   with the per-task up/down buttons. */
function sortSectionTasks(sectId, by){
  var b = board(), s = null;
  for(var k=0;k<b.sections.length;k++) if(b.sections[k].id===sectId){ s=b.sections[k]; break; }
  if(!s) return;
  s.tasks.sort(function(a, c){
    var da = by==="due" ? dueOf(a) : parse(a.start);
    var dc = by==="due" ? dueOf(c) : parse(c.start);
    if(!da && !dc) return 0;
    if(!da) return 1;
    if(!dc) return -1;
    return da.getTime() - dc.getTime();
  });
  touch(); render();
}

function findTask(id){
  var b = board(), out = null;
  b.sections.forEach(function(s){
    s.tasks.forEach(function(t){ if(t.id===id) out = {task:t, sect:s}; });
  });
  return out;
}

/* who covers each role — some roles are shared by 2 people (either could take
   it), so both get pre-assigned as PIC; narrow it down per task afterward */
var WORKFLOW_ROLE_PIC = {
  AE: ["SIN","PALM"],
  LD: ["TT","KANTA"],
  GM: ["KK"],

  PR: ["PALM","KK"],

function picsForRoles(remark){
  var out = [];
  (remark||"").split(",").forEach(function(r){
    var role = r.trim();
    (WORKFLOW_ROLE_PIC[role]||[]).forEach(function(code){
      if(out.indexOf(code)<0) out.push(code);
    });
  });
  return out;
}

/* ============ calendar export ============ */
function pad2(n){ return String(n).padStart(2,"0"); }
function icsDate(d){ return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate()); }
function icsEsc(v){
  return String(v==null?"":v).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
function icsFold(line){
  var bytes = new TextEncoder().encode(line);
  if(bytes.length <= 74) return line;
  var out = [], cur = "", curLen = 0;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    var n = new TextEncoder().encode(ch).length;
    if(curLen + n > 72){ out.push(cur); cur = " "; curLen = 1; }
    cur += ch; curLen += n;
  }
  out.push(cur);
  return out.join("\r\n");
}
/* tasks that still need a deadline reminder */
function dueTasks(b){
  var out = [];
  b.sections.forEach(function(s){
    s.tasks.forEach(function(t){
      if(!isSyncStatus(t.status)) return;
      if(!dueOf(t)) return;
      out.push({t:t, s:s});
    });
  });
  return out;
}
/* Calendar-facing text — deliberately NOT run through tr(): this description
   is shared team-wide content, not tied to whoever happens to click sync, and
   letting it follow the clicking viewer's UI language would change the event
   body (and therefore its gcalEventHash) every time someone syncs in a
   different language than last time, defeating the unchanged-task skip and
   re-notifying guests for nothing. Keep it a fixed, always-English label set. */
function taskDetails(t, s, b){
  var who = (t.pic||[]).map(function(c){ return member(c).name; }).join(", ");
  return [
    b.name + " › " + s.title,
    "PIC: " + (who || "—"),
    "Status: " + t.status,
    "Start: " + fmtShort(t.start) + (t.startTime?" "+t.startTime:"") + "  ·  Duration: " + (t.dur||1) + " days" +
      (t.dueTime?"  ·  Due time: "+t.dueTime:""),
    t.remark ? "Remark: " + t.remark : ""
  ].filter(Boolean).join("\n");
}
function gcalUrl(t){
  var b = board();
  var f = findTask(t.id);
  var s = f ? f.sect : {title:""};
  var sp = eventSpan(t);
  if(!sp) return "https://calendar.google.com/calendar/r";
  var d1, d2;
  if(isHHMM(t.startTime) || isHHMM(t.dueTime)){
    var r = gcalTimedRange(ymd(sp.from), ymd(sp.to), t.startTime, t.dueTime);
    d1 = r.startDT.replace(/[-:]/g,"");
    d2 = r.endDT.replace(/[-:]/g,"");
  }else{
    d1 = icsDate(sp.from); d2 = icsDate(addDays(sp.to,1));
  }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(eventTitle(t, s)) +
    "&dates=" + d1 + "/" + d2 +
    "&details=" + encodeURIComponent(taskDetails(t, s, b));
}
function buildIcs(b){
  var now = new Date();
  var stamp = now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+"T"+
              pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+pad2(now.getUTCSeconds())+"Z";
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SoulScity Learning//SSt Gantt Board//TH",
           "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(b.name)];
  dueTasks(b).forEach(function(x){
    var sp = eventSpan(x.t);
    L.push("BEGIN:VEVENT");
    L.push("UID:"+x.t.id+"-"+b.id+"@sst-gantt-board");
    L.push("DTSTAMP:"+stamp);
    L.push("DTSTART;VALUE=DATE:"+icsDate(sp.from));
    L.push("DTEND;VALUE=DATE:"+icsDate(addDays(sp.to,1)));
    L.push("SUMMARY:"+icsEsc(eventTitle(x.t, x.s)));
    L.push("DESCRIPTION:"+icsEsc(taskDetails(x.t, x.s, b)));
    L.push("CATEGORIES:"+icsEsc(x.s.title));
    L.push("TRANSP:"+(sp.span ? "OPAQUE" : "TRANSPARENT"));
    if(x.t.status !== "Done"){
      L.push("BEGIN:VALARM");
      L.push("ACTION:DISPLAY");
      L.push("TRIGGER:-P1D");
      L.push("DESCRIPTION:"+icsEsc("Due tomorrow: "+x.t.title));
      L.push("END:VALARM");
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}

/* Which statuses hold a slot in the calendar. Only Cancel is pulled back out —
   Done stays as a record of what the team actually shipped. */
function isSyncStatus(st){ return st !== "Cancel"; }
/* D-DAY = the real event days, so it spans START→DUE and blocks time.
   Every other status is a deadline marker on the DUE DATE, free/transparent. */
function isSpanStatus(st){ return st === "D-DAY"; }
function eventSpan(t){
  var du = dueOf(t);
  if(!du) return null;

/* ============ google calendar (direct OAuth, no MCP) ============ */
var GCAL_SCOPE = "https://www.googleapis.com/auth/calendar";
var GCAL_KEY = "sst-gantt-gcal2";
var GCAL_FB_PATH = "gcal_sync";
var gcal = {calendarId:"", lead:1440, scope:"all", invite:true, map:{}};
var gcalToken = null;          /* {access_token, expiresAt} — memory only, never persisted */
var gcalTokenClient = null;

/* local cache only — lets the dialog open instantly with last-known settings
   before loadGcalRemote() below has a chance to answer. */
function loadGcal(){
  try{ var r = localStorage.getItem(GCAL_KEY);
       if(r){ var v = JSON.parse(r); if(v && typeof v==="object") Object.assign(gcal, v); } }catch(e){}
  if(!gcal.map || typeof gcal.map !== "object") gcal.map = {};
}
/* the destination calendar, and — critically — the map of task→event-id/hash
   already sent, are shared team state, not this-browser state: they live in
   Firebase, not just localStorage. Without this, two people syncing the same
   board from two different computers would each have their own blind spot
   about what the other already created, and would happily re-create (and
   re-invite guests to) each other's events. Called once, right before the
   calendar-picker form renders, so the dialog (and the sync it kicks off)
   works from the team's latest ledger rather than a stale local copy. Not
   re-called right before the sync itself — every field in the form saves
   to Firebase on change already, so re-fetching there would risk a race
   that clobbers a selection the user just made with whatever this browser
   last read. */
async function loadGcalRemote(){
  if(!fbDb) return;
  try{
    var res = await withTimeout(fbDb.ref(GCAL_FB_PATH).once("value"), 4000);
    if(res.ok){
      var v = res.value.val();
      if(v && typeof v === "object"){
        Object.assign(gcal, v);
        if(!gcal.map || typeof gcal.map !== "object") gcal.map = {};
        saveGcalLocal();
      }
    }
  }catch(e){}
}
function saveGcalLocal(){ try{ localStorage.setItem(GCAL_KEY, JSON.stringify(gcal)); }catch(e){} }
function saveGcal(){
  saveGcalLocal();
  if(fbDb) fbDb.ref(GCAL_FB_PATH).set(gcal).catch(function(){});
}

function gcalConfigured(){
  return !!(window.GOOGLE_CLIENT_ID && window.GOOGLE_CLIENT_ID.indexOf("YOUR_") < 0);
}
function gcalConnected(){
  return !!(gcalToken && gcalToken.access_token && gcalToken.expiresAt > Date.now()+30000);
}
function ensureTokenClient(){
  if(!gcalConfigured() || !window.google || !google.accounts || !google.accounts.oauth2) return null;
  if(!gcalTokenClient){
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: window.GOOGLE_CLIENT_ID,
      scope: GCAL_SCOPE,
      callback: function(){}
    });
  }
  return gcalTokenClient;
}
function requestToken(interactive){
  return new Promise(function(resolve, reject){
    var tc = ensureTokenClient();
    if(!tc){ reject({message:tr("gis_not_ready")}); return; }
    tc.callback = function(resp){
      if(resp && resp.access_token){
        gcalToken = {access_token:resp.access_token, expiresAt: Date.now() + (resp.expires_in||3600)*1000};
        resolve(gcalToken);
      }else reject(resp||{message:tr("permission_denied")});
    };
    tc.error_callback = function(err){ reject(err||{message:tr("connection_cancelled")}); };
    try{ tc.requestAccessToken({prompt: interactive ? "consent" : ""}); }
    catch(e){ reject(e); }
  });
}
/* Races `promise` against a hard deadline instead of resolving {ok:false}
   like withTimeout() — callers here already have their own try/catch and
   need a real rejection, not a sentinel value. Exists because a stalled
   network fetch, or an interactive OAuth popup that gets silently blocked
   (browsers stop treating requestAccessToken() as a trusted user gesture
   once it's several `await`s deep inside an async loop rather than a
   direct click handler), would otherwise hang the whole sync forever with
   no way out except reloading the page. */
function withDeadline(promise, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var timer = setTimeout(function(){
      if(!done){ done = true; reject(new Error(tr("gcal_timeout_msg"))); }
    }, ms);
    promise.then(function(v){ if(!done){ done=true; clearTimeout(timer); resolve(v); } },
                 function(e){ if(!done){ done=true; clearTimeout(timer); reject(e); } });
  });
}
function gcalFetch(path, opts){
  return withDeadline(gcalFetchNow(path, opts), 15000);
}
/* Both re-auth points below use requestToken(false) — a SILENT refresh
   (prompt:"") — never requestToken(true). By the time any of this runs,
   the user already connected explicitly via the "Connect Google Calendar"
   button (a real click, a real user gesture); these two spots only fire
   later, mid-sync, if the token happens to expire between items. Forcing
   an interactive prompt:"consent" popup at that point — several `await`s
   deep inside an async loop, not in direct response to a click — is
   exactly the kind of popup a browser may block outright, or that a user
   watching a progress bar simply never notices, either way hanging the
   sync with no visible cause. A silent refresh either succeeds invisibly
   (the common case, if the browser's Google session is still active) or
   fails fast — surfacing as one failed item instead of a stuck dialog. */
async function gcalFetchNow(path, opts){
  opts = opts || {};
  if(!gcalConnected()) await requestToken(false);
  var headers = Object.assign({"Authorization":"Bearer "+gcalToken.access_token, "Content-Type":"application/json"}, opts.headers||{});
  var res = await fetch("https://www.googleapis.com/calendar/v3"+path, Object.assign({}, opts, {headers:headers}));
  if(res.status === 401){
    await requestToken(false);
    headers.Authorization = "Bearer "+gcalToken.access_token;
    res = await fetch("https://www.googleapis.com/calendar/v3"+path, Object.assign({}, opts, {headers:headers}));
  }
  if(!res.ok){
    var body = await res.json().catch(function(){ return null; });
    var e = new Error((body && body.error && body.error.message) || ("HTTP "+res.status));
    e.status = res.status;
    throw e;
  }
  if(res.status === 204) return null;
  return res.json();
}

function gcalSyncScope(){ return gcal.scope === "board" ? [board()] : state.boards; }
function gcalSyncTargets(){
  var out = [];
  gcalSyncScope().forEach(function(b){
    b.sections.forEach(function(s){
      s.tasks.forEach(function(t){

/* map entries whose task no longer exists as a valid sync target — deleted,
   cancelled, or its due date cleared. Their calendar events get removed on
   the next sync regardless of what's ticked in the picker; a deleted task
   was never going to show up in that list to tick in the first place. */
function gcalStaleKeys(calId, allTargets){
  var prefix = calId+"|";
  return Object.keys(gcal.map).filter(function(k){
    if(k.indexOf(prefix)!==0) return false;
    var rest = k.slice(prefix.length);
    return !allTargets.some(function(x){ return x.key===rest; });
  });
}
function gcalPicGuests(t){
  var seen = {}, out = [];
  (t.pic||[]).forEach(function(c){
    var m = member(c);
    var e = (m.email||"").trim();
    if(!e || seen[e.toLowerCase()]) return;
    seen[e.toLowerCase()] = 1;
    out.push({email:e, displayName:m.name || c});
  });
  return out;
}
/* wall-clock "HH:MM" + N minutes, wraps at midnight (day component untouched — good enough for our use) */
function addTimeMinutes(hhmm, mins){
  var p = hhmm.split(":"), total = ((+p[0]*60+ +p[1]+mins) % 1440 + 1440) % 1440;
  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
}
function isHHMM(s){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(s||""); }
/* builds a valid, always-end-after-start {startDT,endDT} pair from whatever
   start/due time the user typed — handles missing one side, equal times, and
   (the common real case) a due-time that's earlier in the day than start-time,
   which for single-day tasks would otherwise produce an event ending before
   it starts and get rejected by Google as "Invalid start time". */
function gcalTimedRange(fromDate, toDate, startTime, dueTime){
  var st = isHHMM(startTime) ? startTime : "";
  var dt = isHHMM(dueTime) ? dueTime : "";
  var t1 = st || dt, t2 = dt || st;
  var startDT = fromDate+"T"+t1+":00";
  var endDT = toDate+"T"+t2+":00";
  if(endDT <= startDT){
    t2 = addTimeMinutes(t1, 30);
    endDT = toDate+"T"+t2+":00";
    if(endDT <= startDT) endDT = ymd(addDays(parse(toDate),1))+"T"+t2+":00";
  }
  return {startDT:startDT, endDT:endDT};
}
/* Google Calendar's fixed event palette has 11 slots (colorId "1".."11").
   "11" (Tomato/red) is reserved for D-DAY tasks so they always stand out;
   every other task gets a colorId derived from its section, so the same
   section always lands on the same color (1..10) regardless of sync order. */
function sectionColorId(s){
  if(s && s.color) return s.color;
  var str = (s && (s.id || s.title)) || "";
  var h = 0;
  for(var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return String((h % 10) + 1);
}
function gcalEventBody(x){
  var sp = eventSpan(x.t);
  var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Asia/Bangkok";
  var body = {
    summary: eventTitle(x.t, x.s),
    description: taskDetails(x.t, x.s, x.b),
    transparency: sp.span ? "opaque" : "transparent",
    colorId: x.t.gcalColor || (isSpanStatus(x.t.status) ? "11" : sectionColorId(x.s)),
    reminders: x.t.status==="Done" ? {useDefault:false, overrides:[]} : {useDefault:false, overrides:[{method:"popup", minutes: gcal.lead}]}
  };
  if(isHHMM(x.t.startTime) || isHHMM(x.t.dueTime)){
    var r = gcalTimedRange(ymd(sp.from), ymd(sp.to), x.t.startTime, x.t.dueTime);
    body.start = {dateTime: r.startDT, timeZone: tz};
    body.end   = {dateTime: r.endDT, timeZone: tz};
  }else{
    body.start = {date: ymd(sp.from)};
    body.end = {date: ymd(addDays(sp.to,1))};
  }
  return body;
}
/* fingerprint of everything that would actually change on Google's side for
   this task (event body + guest list) — lets gcalRunSync skip the API call
   entirely for a task that's identical to what was last successfully sent,
   instead of PATCHing (and re-notifying guests on) every synced task on
   every run. */
function gcalEventHash(x){
  var body = gcalEventBody(x);
  var guests = gcal.invite ? gcalPicGuests(x.t).map(function(g){ return g.email.toLowerCase(); }).sort() : [];
  return JSON.stringify(body) + "|" + JSON.stringify(guests);
}
/* "new" (never sent), "changed" (sent before, fingerprint differs now), or
   "unchanged" (sent before, identical) — same comparison gcalRunSync itself
   uses to decide skip/update/create, surfaced here so the picker can show
   it and default the checkboxes sensibly instead of guessing. */
function gcalTargetStatus(x, calId){
  var entry = gcal.map[calId+"|"+x.key];
  var prevId = entry && typeof entry === "object" ? entry.id : entry;
  if(!prevId) return "new";
  var prevHash = entry && typeof entry === "object" ? entry.hash : null;
  return (prevHash === gcalEventHash(x)) ? "unchanged" : "changed";
}
var GCAL_STATUS_VAR = {"new":"--s-done", changed:"--s-process", unchanged:"--s-notstarted"};
var GCAL_STATUS_KEY = {"new":"gcal_status_new", changed:"gcal_status_changed", unchanged:"gcal_status_unchanged"};
/* default checkbox state for the sync picker: pre-check anything new or
   changed, leave already-in-sync items unchecked since there's nothing to
   gain from re-touching them — the user can still tick one back on. */
function gcalDefaultSelection(targets, calId){
  var sel = {};
  targets.forEach(function(x){ sel[x.key] = gcalTargetStatus(x, calId) !== "unchanged"; });
  return sel;
}
function gcalChecklistHtml(targets, calId, selected){
  if(!targets.length) return '<p class="hint" style="margin:0">'+esc(tr("gcal_no_targets"))+'</p>';
  var groups = [], byKey = {};
  targets.forEach(function(x){
    var gk = x.b.id+"|"+x.s.id;
    if(!byKey[gk]){ byKey[gk] = {b:x.b, s:x.s, items:[]}; groups.push(byKey[gk]); }
    byKey[gk].items.push(x);
  });
  return groups.map(function(g){
    var rows = g.items.map(function(x){
      var st = gcalTargetStatus(x, calId);
      var checked = selected[x.key];
      return '<label class="chk"><input type="checkbox" data-gc-task="'+esc(x.key)+'"'+(checked?" checked":"")+'>'+
        '<span>'+esc(x.t.title)+' <span class="hint" style="color:var('+GCAL_STATUS_VAR[st]+')">('+esc(tr(GCAL_STATUS_KEY[st]))+')</span></span>'+
      '</label>';
    }).join("");
    return '<div style="font-weight:600;font-size:12px;color:var(--text-2);margin-top:8px">'+esc(g.b.name)+' › '+esc(g.s.title)+'</div>'+rows;
  }).join("");
}

async function gcalRoute(){
  if(!gcalConfigured()){
    gcalSetBody(gcalErrBox({t:tr("gcal_not_configured_t"), d:tr("gcal_not_configured_d")}),
      '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button>');
    return;
  }
  if(!gcalConnected()){
    gcalSetBody(
      '<p style="margin:0">'+esc(tr("gcal_connect_body"))+'</p>'+
      '<span class="hint">'+esc(tr("gcal_connect_hint"))+'</span>',
      '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button><button class="btn primary" id="gc-connect">'+esc(tr("gcal_connect_btn"))+'</button>'
    );
    document.getElementById("gc-connect").onclick = async function(){
      gcalSetBody('<p style="margin:0;color:var(--muted)">'+esc(tr("gcal_connecting"))+'</p>', '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button>');
      try{ await requestToken(true); gcalRoute(); }
      catch(e){
        gcalSetBody(gcalErrBox({t:tr("gcal_connect_fail_t"), d:(e&&e.message)||tr("gcal_connect_fail_d")}),
          '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button><button class="btn primary" id="gc-retry">'+esc(tr("retry_btn"))+'</button>');
        document.getElementById("gc-retry").onclick = gcalRoute;
      }
    };
    return;
  }
  gcalSetBody('<p style="margin:0;color:var(--muted)">'+esc(tr("gcal_reading_cals"))+'</p>', '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button>');
  await loadGcalRemote();
  try{
    var res = await gcalFetch("/users/me/calendarList?maxResults=250");
    var cals = (res && res.items) || [];
    cals = cals.filter(function(c){
      return c.id && c.id.indexOf("#holiday@") < 0 && (c.accessRole==="owner" || c.accessRole==="writer");
    });
    gcalForm(cals, null);
  }catch(e){
    gcalForm(null, {t:tr("gcal_read_fail_t"), d:(e&&e.message)||tr("unknown_reason"), retry:true});
  }
}
function gcalForm(cals, err){
  var targets = gcalSyncTargets();
  if(!cals || !cals.length){
    gcalSetBody(
      (err?gcalErrBox(err):gcalErrBox({t:tr("gcal_no_cal_t"), d:tr("gcal_no_cal_d")}))+

      '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("close"))+'</button><button class="btn" id="gc-ics">'+esc(tr("download_ics_btn"))+'</button>'+
      (err&&err.retry?'<button class="btn primary" id="gc-retry">'+esc(tr("retry_btn"))+'</button>':'')
    );
    document.getElementById("gc-ics").onclick = downloadIcs;
    var rt = document.getElementById("gc-retry");
    if(rt) rt.onclick = gcalRoute;
    return;
  }
  if(!gcal.calendarId || !cals.some(function(c){ return c.id===gcal.calendarId; })){
    var pref = cals.filter(function(c){ return /soulscity/i.test(c.summary||""); })[0];
    gcal.calendarId = (pref||cals[0]).id;
  }
  var opts = cals.map(function(c){
    return '<option value="'+esc(c.id)+'"'+(c.id===gcal.calendarId?" selected":"")+'>'+esc(c.summary||c.id)+'</option>';
  }).join("");
  var leads = [[0,tr("lead_0")],[1440,tr("lead_1d")],[2880,tr("lead_2d")],[4320,tr("lead_3d")],[10080,tr("lead_1w")]];
  var leadOpts = leads.map(function(l){
    return '<option value="'+l[0]+'"'+(gcal.lead===l[0]?" selected":"")+'>'+esc(l[1])+'</option>';
  }).join("");
  var synced = Object.keys(gcal.map).length;
  var withMail = state.team.filter(function(m){ return (m.email||"").trim(); }).length;
  var selection = gcalDefaultSelection(targets, gcal.calendarId);
  var staleCount = gcalStaleKeys(gcal.calendarId, targets).length;

  gcalSetBody(
    '<div style="border:1px solid var(--border);border-radius:8px;background:var(--surface-2);'+
      'padding:9px 11px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-2)">'+
      '<div><b style="color:var(--s-dday)">D-DAY</b> '+tr("gcal_dday_rule")+'</div>'+
      '<div><b style="color:var(--s-notstarted)">Not started</b> · <b style="color:var(--s-process)">In process</b> · '+
        '<b style="color:var(--s-postponed)">Postponed</b> '+tr("gcal_normal_rule")+'</div>'+
      '<div><b style="color:var(--s-done)">Done</b> '+tr("gcal_done_rule")+'</div>'+
      '<div><b style="color:var(--s-cancel)">Cancel</b> '+tr("gcal_cancel_rule")+'</div>'+
    '</div>'+
    '<div class="field"><label>'+esc(tr("gcal_target_cal_label"))+'</label><select id="gc-cal">'+opts+'</select></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>'+esc(tr("gcal_scope_label"))+'</label><select id="gc-scope">'+
        '<option value="all"'+(gcal.scope!=="board"?" selected":"")+'>'+esc(tr("gcal_scope_all",{n:state.boards.length}))+'</option>'+
        '<option value="board"'+(gcal.scope==="board"?" selected":"")+'>'+esc(tr("gcal_scope_board"))+'</option>'+
      '</select></div>'+
      '<div class="field"><label>'+esc(tr("gcal_reminder_label"))+'</label><select id="gc-lead">'+leadOpts+'</select></div>'+
    '</div>'+
    '<div class="field"><label>'+esc(tr("gcal_attendees_label"))+'</label>'+
      '<label class="chk"><input type="checkbox" id="gc-invite"'+(gcal.invite?" checked":"")+'>'+
        '<span>'+esc(tr("gcal_invite_label",{have:withMail, total:state.team.length}))+'</span></label>'+
      (withMail<state.team.length?'<span class="hint">'+esc(tr("gcal_invite_hint"))+'</span>':'')+
    '</div>'+
    '<div class="field">'+
      '<label>'+esc(tr("gcal_pick_label"))+'</label>'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<button type="button" class="btn sm" id="gc-selall">'+esc(tr("tpl_select_all"))+'</button>'+
        '<button type="button" class="btn sm" id="gc-clearall">'+esc(tr("tpl_clear_all"))+'</button>'+
        '<span class="hint" id="gc-count" style="margin-left:auto"></span>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:2px">'+gcalChecklistHtml(targets, gcal.calendarId, selection)+'</div>'+
      (staleCount>0?'<span class="hint" style="display:block">'+esc(tr("gcal_stale_note",{n:staleCount}))+'</span>':'')+
      '<span class="hint" id="gc-warn" style="display:none;color:var(--s-cancel)">'+esc(tr("gcal_pick_warn"))+'</span>'+
    '</div>'+
    '<span class="hint">'+esc(synced?tr("gcal_resync_hint",{n:synced}):tr("gcal_first_sync_hint"))+'</span>',
    '<div class="spacer"></div><button class="btn" id="gc-ics">.ics</button>'+
    '<button class="btn" data-x>'+esc(tr("close"))+'</button><button class="btn primary" id="gc-go">'+esc(tr("send_to_calendar_btn"))+'</button>'
  );
  document.getElementById("gc-cal").onchange = function(){ gcal.calendarId=this.value; saveGcal(); gcalForm(cals, null); };
  document.getElementById("gc-lead").onchange = function(){ gcal.lead=+this.value; saveGcal(); };
  document.getElementById("gc-invite").onchange = function(){ gcal.invite=this.checked; saveGcal(); gcalForm(cals, null); };
  document.getElementById("gc-scope").onchange = function(){ gcal.scope=this.value; saveGcal(); gcalForm(cals, null); };
  function updateGcCount(){
    var n = document.querySelectorAll("[data-gc-task]:checked").length;
    document.getElementById("gc-count").textContent = tr("gcal_select_count",{sel:n, total:targets.length});
  }
  document.querySelectorAll("[data-gc-task]").forEach(function(cb){ cb.onchange = updateGcCount; });
  document.getElementById("gc-selall").onclick = function(){
    document.querySelectorAll("[data-gc-task]").forEach(function(cb){ cb.checked = true; });
    updateGcCount();

  document.getElementById("gc-clearall").onclick = function(){
    document.querySelectorAll("[data-gc-task]").forEach(function(cb){ cb.checked = false; });

  };

    var picked = {};
    document.querySelectorAll("[data-gc-task]:checked").forEach(function(cb){ picked[cb.getAttribute("data-gc-task")] = true; });
    /* only block on an empty pick if there's also no stale cleanup pending —
       a deleted task never appears in this checklist to begin with, so
       requiring a tick here would make "just remove the deleted one" mean
       ticking something unrelated first. */
    if(!Object.keys(picked).length && !staleCount){
      document.getElementById("gc-warn").style.display = "block";
      return;
    }
    gcalRunSync(cals, picked);
  };
}

async function gcalRunSync(cals, selectedKeys){
  var allTargets = gcalSyncTargets();
  var calId = gcal.calendarId;
  /* stale-event cleanup always looks at every valid target, never just the
     ones the user picked this round — otherwise simply not selecting a
     still-valid task this time would get its calendar event deleted. */
  var stale = gcalStaleKeys(calId, allTargets);
  var targets = selectedKeys ? allTargets.filter(function(x){ return selectedKeys[x.key]; }) : allTargets;
  var total = targets.length + stale.length;
  var created=0, updated=0, removed=0, invited=0, skipped=0, failed=[];
  var done=0;
  function progress(){
    gcalSetBody(
      '<p style="margin:0">'+esc(tr("gcal_syncing"))+'</p>'+
      '<div style="height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden">'+
        '<div style="height:100%;width:'+Math.round(done/Math.max(1,total)*100)+'%;background:var(--accent)"></div></div>'+
      '<span class="hint">'+done+' / '+total+'</span>'+
      '<span class="hint" style="display:block;color:var(--s-postponed)">'+esc(tr("gcal_stay_on_tab"))+'</span>',
      '<div class="spacer"></div><button class="btn" data-x>'+esc(tr("gcal_close_keep_going"))+'</button><button class="btn" disabled>'+esc(tr("sending_btn"))+'</button>'
    );
  }
  progress();

  for(var i=0;i<targets.length;i++){
    var x = targets[i];
    var mk = calId+"|"+x.key;
    var entry = gcal.map[mk];
    var prevId = entry && typeof entry === "object" ? entry.id : entry;
    var prevHash = entry && typeof entry === "object" ? entry.hash : null;
    var hash = gcalEventHash(x);
    if(prevId && prevHash === hash){
      skipped++;
      done++; progress();
      continue;
    }
    var body = gcalEventBody(x);
    var guests = gcal.invite ? gcalPicGuests(x.t) : [];
    if(guests.length) body.attendees = guests;
    var sendUpdates = gcal.invite ? "all" : "none";
    try{
      if(prevId){
        try{
          await gcalFetch("/calendars/"+encodeURIComponent(calId)+"/events/"+encodeURIComponent(prevId)+"?sendUpdates="+sendUpdates,
            {method:"PATCH", body:JSON.stringify(body)});
          gcal.map[mk] = {id:prevId, hash:hash};
          updated++; invited += guests.length;
        }catch(e1){
          if(e1 && (e1.status===404 || e1.status===410)){
            delete gcal.map[mk];
            var r1 = await gcalFetch("/calendars/"+encodeURIComponent(calId)+"/events?sendUpdates="+sendUpdates,
              {method:"POST", body:JSON.stringify(body)});
            gcal.map[mk] = {id:r1.id, hash:hash};
            created++; invited += guests.length;
          } else throw e1;
        }
      }else{
        var r2 = await gcalFetch("/calendars/"+encodeURIComponent(calId)+"/events?sendUpdates="+sendUpdates,
          {method:"POST", body:JSON.stringify(body)});
        gcal.map[mk] = {id:r2.id, hash:hash};
        created++; invited += guests.length;
      }
    }catch(e){
      failed.push({title:x.t.title, info:{t:tr("gcal_send_fail_t"), d:(e&&e.message)||tr("unknown_reason")}});
    }
    saveGcal();
    done++; progress();
  }
  for(var j=0;j<stale.length;j++){
    var k = stale[j];
    var staleEntry = gcal.map[k];
    var staleId = staleEntry && typeof staleEntry === "object" ? staleEntry.id : staleEntry;
    try{
      await gcalFetch("/calendars/"+encodeURIComponent(calId)+"/events/"+encodeURIComponent(staleId)+"?sendUpdates=none", {method:"DELETE"});
      removed++;
      delete gcal.map[k];
    }catch(e2){
      if(e2 && (e2.status===404 || e2.status===410)){
        /* already gone upstream, nothing left to track */
        delete gcal.map[k];
      }else{
        /* a real failure (network/auth/timeout) — keep tracking it so the
           next sync retries the delete, instead of silently forgetting an
           event that's still sitting on the calendar. */
        failed.push({title:k, info:{t:tr("gcal_send_fail_t"), d:(e2&&e2.message)||tr("unknown_reason")}});
      }
    }
    saveGcal();
    done++; progress();
  }

  gcalResult(cals, {created:created, updated:updated, removed:removed, invited:invited, skipped:skipped, failed:failed,
    cal:(cals.filter(function(c){return c.id===calId;})[0]||{}).summary || calId});
}
function gcalResult(cals, r){
  var rows = [
    [tr("gcal_created"), r.created, "--s-done"],
    [tr("gcal_updated"), r.updated, "--s-process"],
    [tr("gcal_removed"), r.removed, "--s-notstarted"],
    [tr("gcal_invited"), r.invited, "--s-dday"],
    [tr("gcal_skipped"), r.skipped, "--s-notstarted"]
  ].filter(function(x){ return x[1]>0; });
  if(!rows.length && !r.failed.length) rows = [[tr("gcal_nothing_changed"), 0, "--s-notstarted"]];

  gcalSetBody(
    '<p style="margin:0">'+tr("gcal_sync_success",{cal:esc(r.cal)})+'</p>'+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
      rows.map(function(x){
        return '<div style="display:flex;align-items:center;gap:9px">'+
          '<i style="width:9px;height:9px;border-radius:3px;background:var('+x[2]+');display:block"></i>'+
          '<span style="flex:1 1 auto">'+esc(x[0])+'</span>'+
          '<b style="font-family:\'IBM Plex Mono\',monospace;font-variant-numeric:tabular-nums">'+x[1]+'</b></div>';
      }).join("")+
    '</div>'+
    (r.failed.length ? gcalErrBox({t:tr("gcal_fail_count_t",{n:r.failed.length}),
        d: r.failed.slice(0,3).map(function(x){ return x.title+" — "+x.info.d; }).join(" · ") +
           (r.failed.length>3?tr("gcal_fail_more",{n:r.failed.length-3}):"") +
           tr("gcal_fail_check")}) : '')+
    '<span class="hint">'+esc(tr("gcal_resend_hint"))+'</span>',
    '<div class="spacer"></div>'+
    '<a class="btn" target="_blank" rel="noopener noreferrer" href="https://calendar.google.com/calendar/r">'+esc(tr("open_gcal_link"))+'</a>'+
    (r.failed.length ? '<button class="btn primary" id="gc-retry2">'+esc(tr("retry_btn"))+'</button>' : '<button class="btn primary" data-x>'+esc(tr("done_btn"))+'</button>')
  );
  var rt = document.getElementById("gc-retry2");
  if(rt) rt.onclick = function(){ gcalRunSync(cals); };
}

/* resolves {ok:false} instead of hanging forever if a promise never settles
   (e.g. wrong/unreachable Firebase config) — boot() must always reach render() */
function withTimeout(promise, ms){
  return new Promise(function(resolve){
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done=true; resolve({ok:false}); } }, ms);
    promise.then(function(v){ if(!done){ done=true; clearTimeout(timer); resolve({ok:true, value:v}); } },
                 function(){ if(!done){ done=true; clearTimeout(timer); resolve({ok:false}); } });
  });
}

/* ============ boot ============ */
async function boot(){
  loadView();
  loadGcal();
  fbDb = initFirebase();
  var remoteConfirmedEmpty = false;

  if(fbDb){
    var res = await withTimeout(fbDb.ref(FB_PATH).once("value"), 4000);
    if(res.ok){
      var v = res.value.val();
      if(v && Object.keys(v).length) state = normalizeState(v);
      else remoteConfirmedEmpty = true;
    }
    /* !res.ok: timed out or errored — connection status unknown, do NOT assume
       empty (that could later overwrite real data once the connection comes back).
       Fall through to local seed just so the page isn't blank; subscribeRealtime()
       below will replace it with the real data as soon as Firebase responds. */
  }
  if(!state) state = normalizeState(seed());

  if(fbDb && (remoteConfirmedEmpty || backfillEmails())) touch();
  if(!view.dayW) view.dayW = 24;
  var ids = state.boards.map(function(b){ return b.id; });
  if(ids.indexOf(view.activeBoard) < 0) view.activeBoard = state.activeBoard || ids[0];
  render();
  setSave(fbDb ? "saved" : "unconfigured");
  if(fbDb) subscribeRealtime();
}
boot();

})();
